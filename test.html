<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Big Circle Checkbox – On Demand</title>
</head>
<body style="margin:0;background:#0b0c10;color:#e6eaf2;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica Neue,Arial">

<!-- Your containers (can be anywhere in the page, any IDs you like) -->
<div id="app-123457" style="padding:24px"></div>
<div id="app-logs"   style="padding:24px"></div>

<!-- The on-demand module (drop this once on the page) -->
<script>
    (function () {
        const COLORS = {
            bg: "#0b0c10",
            card: "#111317",
            text: "#e6eaf2",
            muted: "#9aa4b2",
            border: "#20242b",
            ring: "rgba(91,156,255,0.25)",
            ok: "#1AB394",       // checked green
            grey: "#9aa4b2",     // unchecked circle
            greyLight: "#e6e8ee" // disabled circle
        };

        // Create an element with inline styles and attributes
        function el(tag, styleObj = {}, attrs = {}) {
            const node = document.createElement(tag);
            Object.assign(node.style, styleObj);
            for (const [k, v] of Object.entries(attrs)) {
                if (k === "text") node.textContent = v;
                else node.setAttribute(k, v);
            }
            return node;
        }

        // Build a single Big Circle Checkbox card
        function createCard({ title, description, defaultChecked=false, disabled=false, onChange } = {}) {
            const styles = {
                card: {
                    position: "relative",
                    display: "flex",
                    alignItems: "flex-start",
                    gap: "16px",
                    background: COLORS.card,
                    border: `1px solid ${COLORS.border}`,
                    borderRadius: "16px",
                    padding: "18px",
                    cursor: disabled ? "not-allowed" : "pointer",
                    userSelect: "none",
                    transition: "box-shadow .2s ease, transform .02s ease, border-color .2s ease",
                },
                hiddenInput: {
                    position: "absolute",
                    inset: "0px",
                    opacity: "0",
                    width: "100%",
                    height: "100%",
                    cursor: disabled ? "not-allowed" : "pointer",
                },
                circle: {
                    flex: "0 0 auto",
                    width: "64px",  /* BIG circle */
                    height: "64px",
                    borderRadius: "50%",
                    display: "grid",
                    placeItems: "center",
                    border: `2px solid ${COLORS.border}`,
                    background: COLORS.grey,     // grey when unchecked
                    boxShadow: "none",
                    transition: "background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .02s ease",
                },
                tick: {
                    width: "34px",
                    height: "34px",
                    opacity: "0",
                    transform: "scale(0.9)",
                    transition: "opacity .18s ease, transform .18s ease",
                    color: "#ffffff",
                },
                content: { display: "grid", gap: "6px", minWidth: "0" },
                title:   { fontWeight: "800", letterSpacing: ".2px", fontSize: "1.06rem", color: COLORS.text },
                desc:    { fontSize: ".96rem", color: COLORS.muted },
            };

            const wrap   = el("label", styles.card);
            const input  = el("input", styles.hiddenInput, {
                type: "checkbox",
                "aria-checked": String(!!defaultChecked),
                "aria-disabled": String(!!disabled)
            });
            input.checked  = !!defaultChecked;
            input.disabled = !!disabled;

            const circle = el("span", styles.circle, { "aria-hidden": "true" });
            const svg    = el("svg", styles.tick, { viewBox: "0 0 24 24", fill: "none" });
            svg.setAttribute("stroke", "currentColor");
            svg.setAttribute("stroke-width", "3");
            svg.setAttribute("stroke-linecap", "round");
            svg.setAttribute("stroke-linejoin", "round");
            const poly   = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            poly.setAttribute("points", "20 6 9 17 4 12");
            svg.appendChild(poly);

            const content = el("span", styles.content);
            const titleEl = el("span", styles.title, { text: title || "Title" });
            const descEl  = el("span", styles.desc,  { text: description || "Explanation goes here." });
            content.append(titleEl, descEl);

            circle.appendChild(svg);
            wrap.append(input, circle, content);

            // Sync visuals to state
            function applyState() {
                if (input.disabled) {
                    circle.style.background = COLORS.greyLight; // light grey when disabled
                    circle.style.borderColor = COLORS.greyLight;
                    circle.style.boxShadow   = "none";
                    titleEl.style.color = COLORS.muted;
                    descEl .style.color = COLORS.muted;
                } else if (input.checked) {
                    circle.style.background = COLORS.ok;        // green #1AB394 when checked
                    circle.style.borderColor = COLORS.ok;
                    circle.style.boxShadow   = "0 10px 22px -10px rgba(26,179,148,0.5)";
                    titleEl.style.color = COLORS.text;
                    descEl .style.color = COLORS.muted;
                } else {
                    circle.style.background = COLORS.grey;      // solid grey when unchecked
                    circle.style.borderColor = COLORS.border;
                    circle.style.boxShadow   = "none";
                    titleEl.style.color = COLORS.text;
                    descEl .style.color = COLORS.muted;
                }
                svg.style.opacity   = input.checked && !input.disabled ? "1" : "0";
                svg.style.transform = input.checked && !input.disabled ? "scale(1)" : "scale(0.9)";
                wrap.style.cursor   = input.disabled ? "not-allowed" : "pointer";
            }

            // Accessibility/focus
            input.addEventListener("focus", () => { if (!input.disabled) wrap.style.boxShadow = `0 0 0 4px ${COLORS.ring}`; });
            input.addEventListener("blur",  () => { wrap.style.boxShadow = "none"; });

            // Press animation
            wrap.addEventListener("mousedown", () => { if (!input.disabled) wrap.style.transform = "translateY(1px)"; });
            ["mouseup","mouseleave"].forEach(evt => wrap.addEventListener(evt, () => { wrap.style.transform = "translateY(0)"; }));

            // Toggle
            input.addEventListener("change", () => {
                input.setAttribute("aria-checked", String(input.checked));
                applyState();
                if (typeof onChange === "function") onChange(input.checked);
            });
            wrap.addEventListener("click", (e) => {
                if (e.target === input || input.disabled) return;
                input.checked = !input.checked;
                input.dispatchEvent(new Event("change", { bubbles: true }));
            });

            applyState();

            return {
                root: wrap,
                input,
                setChecked(flag) {
                    input.checked = !!flag;
                    input.setAttribute("aria-checked", String(!!flag));
                    applyState();
                },
                setDisabled(flag) {
                    input.disabled = !!flag;
                    input.setAttribute("aria-disabled", String(!!flag));
                    applyState();
                }
            };
        }

        // Public on-demand API
        const API = {
            /**
             * Render multiple cards into a container by ID.
             * @param {string} containerId
             * @param {Array<{title,description,defaultChecked,disabled,onChange}>} items
             * @returns {Array} controllers
             */
            renderList(containerId, items = []) {
                const host = document.getElementById(containerId);
                if (!host) { console.warn("Container not found:", containerId); return []; }
                const grid = el("div", { maxWidth: "780px", margin: "0 auto", display: "grid", gap: "16px" });
                host.appendChild(grid);
                const ctrls = [];
                for (const cfg of items) {
                    const card = createCard(cfg || {});
                    grid.appendChild(card.root);
                    ctrls.push(card);
                }
                return ctrls;
            },

            /**
             * Append a single card to a container by ID.
             * @param {string} containerId
             * @param {object} item
             * @returns {object|null} controller
             */
            add(containerId, item = {}) {
                const host = document.getElementById(containerId);
                if (!host) { console.warn("Container not found:", containerId); return null; }
                // Reuse last grid if present, else create a new one
                let grid = host.lastElementChild;
                const isGrid = grid && grid.style && grid.style.display === "grid";
                if (!isGrid) {
                    grid = el("div", { maxWidth: "780px", margin: "0 auto", display: "grid", gap: "16px" });
                    host.appendChild(grid);
                }
                const card = createCard(item);
                grid.appendChild(card.root);
                return card;
            },

            /**
             * Clear all content of a container by ID.
             * @param {string} containerId
             */
            clear(containerId) {
                const host = document.getElementById(containerId);
                if (host) host.innerHTML = "";
            }
        };

        // Expose globally
        window.BigCircleCheckbox = API;
    })();
</script>

<!-- DEMO: Call on demand (you can remove this block in production) -->
<script>
    // Render a batch into #app-123457
    const ctrls = BigCircleCheckbox.renderList("app-123457", [
        { title: "Enable advanced protection", description: "Extra checks & recommendations." },
        { title: "Weekly summary emails",     description: "Mondays at 08:00.", defaultChecked: true },
        { title: "Join beta program",         description: "Currently closed.", disabled: true }
    ]);

    // Append one later (on demand)
    const c = BigCircleCheckbox.add("app-123457", {
        title: "Block suspicious bots",
        description: "Enable heuristic bot blocking rules.",
        onChange: (val) => console.log("Bots setting:", val)
    });
    // Programmatic control
    c.setChecked(true);
    c.setDisabled(false);

    // Separate container at any time
    BigCircleCheckbox.renderList("app-logs", [
        { title: "Log HTTP requests", description: "Write access logs for troubleshooting.", defaultChecked: true }
    ]);

    // Example: clear and rebuild later
    // BigCircleCheckbox.clear("app-123457");
    // BigCircleCheckbox.renderList("app-123457", [{ title: "Rebuilt option", description: "Fresh list." }]);
</script>
</body>
</html>
