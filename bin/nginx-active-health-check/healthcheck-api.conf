server {
    listen 127.0.0.1:9199;  # Admin port (restrict access!)

    # Reset metrics for specific upstream
    location ~ ^/admin/reset-metrics/(.+)$ {
        content_by_lua_block {
            local adaptive = require "balancer_adaptive"
            local upstream_name = ngx.var[1]
            local upstream, deleted = adaptive.reset_all_metrics(upstream_name)
            ngx.header.content_type = "application/json"
            ngx.say('{"upstream":"' .. upstream .. '","deleted":' .. deleted .. '}')
        }
    }

    # Get adaptive metrics (Prometheus format)
    location /admin/metrics {
        content_by_lua_block {
            ngx.header.content_type = "text/plain; version=0.0.4"
            local adaptive = require "balancer_adaptive"
            local upstreams = adaptive.get_all_upstreams()
            for u, data in pairs(upstreams) do
                for addr, m in pairs(data.backends) do
                    ngx.say(string.format('adaptive_ewma_response_time{upstream="%s",backend="%s"} %f', u, addr, m.ewma))
                    ngx.say(string.format('adaptive_age_penalty{upstream="%s",backend="%s"} %f', u, addr, m.age_penalty))
                end
            end
        }
    }
}

  server {

      listen 127.0.0.1:9099;

      server_name localhostrest;

      access_log off;

location /internal/health-state {
              content_by_lua_block {
                  if ngx.var.remote_addr ~= "127.0.0.1" then
                      return ngx.exit(403)
                  end
                  ngx.req.read_body()
                  local body = ngx.req.get_body_data()
                  if not body then
                      return ngx.exit(400)
                  end
                  local health_state = ngx.shared.health_state
                  health_state:set("state", body)
                  ngx.say("OK")
              }
          }

 location /internal/metrics {
          content_by_lua_block {
              if ngx.var.remote_addr ~= "127.0.0.1" then
                  return ngx.exit(403)
              end

              local health_state = ngx.shared.health_state

              ngx.say("capacity: ", health_state:capacity())
              ngx.say("free: ", health_state:free_space())
              ngx.say("used: ", health_state:capacity() - health_state:free_space())
          }
}
      location /healthcheck/update {

          default_type application/json;



          content_by_lua_block {

              local cjson = require "cjson"

              local healthcheck = require "healthcheck_active"



              ngx.req.read_body()

              local body_data = ngx.req.get_body_data()



              if not body_data then

                  ngx.status = 400

                  ngx.say(cjson.encode({error = "no body"}))

                  return

              end



              local ok, data = pcall(cjson.decode, body_data)



              if not ok or not data.upstream or not data.server or data.healthy == nil then

                  ngx.status = 400

                  ngx.say(cjson.encode({error = "invalid request"}))

                  return

              end




              healthcheck.handle_update(

                  data.upstream,

                  data.server,

                  data.healthy,

                  data.timestamp  -- ← Added this

              )



              ngx.say(cjson.encode({status = "ok"}))

          }

      }



      # Status endpoint for monitoring

      location /healthcheck/status {

          default_type application/json;



          content_by_lua_block {

              local cjson = require "cjson"

              local healthcheck = require "healthcheck_active"



              local upstream = ngx.var.arg_upstream

              if not upstream then

                  ngx.status = 400

                  ngx.say(cjson.encode({error = "missing upstream parameter"}))

                  return

              end



              local servers = healthcheck.get_all_servers(upstream)

              ngx.say(cjson.encode({

                  upstream = upstream,

                  servers = servers,

                  timestamp = ngx.time()

              }))

          }

      }
}
