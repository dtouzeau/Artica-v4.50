# Status endpoint for health check service
# Add this to your Nginx configuration

server {
    listen 127.0.0.1:8099;
    server_name localhost;

    # Health check status endpoint
    location /healthcheck/status {
        default_type application/json;
        content_by_lua_block {
            local healthcheck = require "healthcheck"
            local state = healthcheck.get_state()

            if state then
                ngx.say(require("cjson").encode(state))
            else
                ngx.status = 503
                ngx.say('{"error": "Health check service unavailable"}')
            end
        }
    }

    # Check specific upstream
    location ~ ^/healthcheck/upstream/(.+)$ {
        default_type application/json;
        content_by_lua_block {
            local healthcheck = require "healthcheck"
            local upstream_name = ngx.var[1]
            local servers = healthcheck.get_all_servers(upstream_name)

            if servers and next(servers) ~= nil then
                ngx.say(require("cjson").encode({
                    upstream = upstream_name,
                    servers = servers
                }))
            else
                ngx.status = 404
                ngx.say('{"error": "Upstream not found"}')
            end
        }
    }

    # Health endpoint for monitoring
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}
